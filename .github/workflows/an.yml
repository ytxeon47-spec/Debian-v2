name: Windows 10 Enterprise G QEMU (32GB RAM, 4 Cores Desktop i5 CPU, Tailscale & noVNC)

on:
  workflow_dispatch:

jobs:
  run-windows10-qemu:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/4] Installing QEMU & KVM Tools ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            curl \
            wget \
            aria2

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (128GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 128G

      - name: 2. Download Windows 10 ISO & VirtIO Drivers
        run: |
          echo "=== [STEP 2/4] Downloading Windows 10 ISO & VirtIO Drivers ==="
          
          WIN_ISO_URL="https://archive.org/download/en_windows_10_enterprise_g/en_windows_10_enterprise_g_22h2_build_19045.3570.iso"
          VIRTIO_URL="https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.240-1/virtio-win.iso"
          
          echo "Downloading Windows 10 ISO..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win10.iso "$WIN_ISO_URL" || wget -O /tmp/win10.iso "$WIN_ISO_URL"
          
          echo "Downloading VirtIO Drivers ISO..."
          aria2c -x 8 -s 8 -k 1M -d /tmp -o virtio-win.iso "$VIRTIO_URL" || wget -O /tmp/virtio-win.iso "$VIRTIO_URL"

          ls -lh /tmp/win10.iso /tmp/virtio-win.iso

      - name: 3. Connect Tailscale
        run: |
          echo "=== [STEP 3/4] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="win10-qemu-runner-${{ github.run_id }}" \
            --accept-routes || true
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4 || true)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 4. Launch QEMU Windows 10 & noVNC Web Access
        run: |
          echo "=== [STEP 4/4] Starting QEMU Windows 10 Machine ==="
          
          # Конфиг домашнего ПК: 32 GB RAM, 4 Cores Intel Core i5-10400, VGA Std
          qemu-system-x86_64 \
            -enable-kvm \
            -m 32768 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu Skylake-Client,vendor=GenuineIntel,modelname="Intel(R) Core(TM) i5-10400 CPU @ 2.90GHz" \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -drive file=/tmp/virtio-win.iso,index=2,media=cdrom \
            -vga std \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          # Настройка noVNC
          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 10 ENTERPRISE G READY"
          echo "=================================================="
          echo " OS Image     : Windows 10 Enterprise G (22H2)"
          echo " CPU Model    : Intel(R) Core(TM) i5-10400 (4 Cores / Desktop CPU)"
          echo " RAM          : 32 GB (32768 MB)"
          echo " Storage Size : 128 GB Main Disk"
          echo " Graphics     : Standard VGA (-vga std)"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          # Удерживаем раннер 6 часов
          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
