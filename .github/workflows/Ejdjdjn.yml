name: Custom Windows 10 QEMU (Intel Xeon Gold 6348, 16GB RAM)

on:
  workflow_dispatch:

jobs:
  run-win10-qemu:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/4] Installing QEMU, KVM & OVMF Firmware ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            dosfstools \
            mtools

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (500GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 500G

      - name: 2. Download Windows 10 ISO
        run: |
          echo "=== [STEP 2/4] Downloading Windows 10 ISO ==="
          
          ISO_URL="https://archive.org/download/windows-10_20250816/W18.iso"
          
          echo "Downloading ISO to /tmp/win10.iso..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win10.iso "$ISO_URL" || wget -O /tmp/win10.iso "$ISO_URL"
          
          ls -lh /tmp/win10.iso

      - name: 3. Connect Tailscale
        run: |
          echo "=== [STEP 3/4] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="win10-qemu-runner-${{ github.run_id }}" \
            --accept-routes || true
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4 || true)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 4. Launch QEMU Windows 10 & noVNC Web Access
        run: |
          echo "=== [STEP 4/4] Starting QEMU Windows 10 Machine ==="
          
          # Запуск QEMU: Intel Xeon Gold 6348 (4 ядра), 16 GB RAM, OVMF UEFI
          qemu-system-x86_64 \
            -enable-kvm \
            -m 16384 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu IceLake-Server,vendor=GenuineIntel,modelname="Intel(R) Xeon(R) Gold 6348 CPU @ 2.60GHz" \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -vga std \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 10 QEMU READY"
          echo "=================================================="
          echo " OS Image     : W18.iso (Archive.org)"
          echo " CPU Model    : Intel(R) Xeon(R) Gold 6348 CPU @ 2.60GHz (4 Cores)"
          echo " RAM          : 16 GB (16384 MB)"
          echo " Storage Size : 500 GB Main Disk"
          echo " Firmware     : OVMF UEFI"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
